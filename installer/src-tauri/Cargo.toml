[package]
name = "MapInstaller"
version = "0.2.0"
description = "KraiMaps Installer"
authors = ["KraiMaps"]
edition = "2026"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-shell = "2.3.6"
tauri-plugin-store = "2.4.4"
tauri-plugin-log = "2.9.1"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
chrono = "0.4.45"
walkdir = "2.5.0"
dirs = "7.0.0"
sha2 = "0.11.0"
sha1 = "0.10"
zip = "8.6.0"
keyring = "4.2.0"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.36"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
toml = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.23.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
semver = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
